# SafeFare — domain ONLY (dirshay.com). IP toos ah ma furmo.
#
# Install:
#   sudo cp deploy/nginx-dirshay.com.conf /etc/nginx/sites-available/dirshay.com
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo ln -sf /etc/nginx/sites-available/dirshay.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# backend/.env:
#   HOST=127.0.0.1
#   PUBLIC_URL=http://dirshay.com
#   CORS_ORIGINS=http://dirshay.com,https://dirshay.com,http://www.dirshay.com

# IP ama domain aan la aqoonsan — xiro
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Kaliya dirshay.com
server {
    listen 80;
    listen [::]:80;
    server_name dirshay.com www.dirshay.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
