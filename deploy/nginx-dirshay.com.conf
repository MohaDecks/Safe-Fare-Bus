# SafeFare — dirshay.com → Node.js :4000
# Install:
#   sudo cp deploy/nginx-dirshay.com.conf /etc/nginx/sites-available/dirshay.com
#   sudo ln -sf /etc/nginx/sites-available/dirshay.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# backend/.env:
#   PUBLIC_URL=http://dirshay.com
#   CORS_ORIGINS=http://dirshay.com,https://dirshay.com

server {
    listen 80;
    listen [::]:80;
    server_name dirshay.com www.dirshay.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
