name: safefare_mobile
description: SafeFare customer app (phone + OTP)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  intl: ^0.19.0
  audioplayers: ^6.1.0
  url_launcher: ^6.3.1
  web: ^1.1.1
  webview_flutter: ^4.10.0
  webview_flutter_web: ^0.2.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
